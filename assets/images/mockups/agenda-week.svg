<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Temporary mockup of the CISMed weekly calendar view. Replace with a real screenshot. -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06284B" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="20" y="16" width="720" height="520" rx="18" fill="#fff" filter="url(#shadow)"/>

  <!-- Toolbar -->
  <text x="48" y="62" font-size="20" font-weight="700" fill="#06284B">Agenda</text>
  <text x="48" y="84" font-size="13" fill="#64748B">14 – 18 de septiembre</text>
  <rect x="200" y="46" width="30" height="30" rx="8" fill="#F1F5F9"/>
  <path d="M218 54l-6 7 6 7" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="238" y="46" width="30" height="30" rx="8" fill="#F1F5F9"/>
  <path d="M250 54l6 7-6 7" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="556" y="44" width="160" height="36" rx="18" fill="#F1F5F9"/>
  <text x="598" y="67" font-size="13" fill="#64748B" text-anchor="middle">Día</text>
  <rect x="640" y="48" width="72" height="28" rx="14" fill="#fff"/>
  <text x="676" y="67" font-size="13" font-weight="600" fill="#0072E8" text-anchor="middle">Semana</text>

  <!-- Day headers -->
  <g font-size="13" fill="#64748B" text-anchor="middle">
    <text x="165" y="124">Lun 14</text>
    <text x="287" y="124">Mar 15</text>
    <text x="409" y="124">Mié 16</text>
    <text x="531" y="124">Jue 17</text>
    <text x="653" y="124">Vie 18</text>
  </g>

  <!-- Grid -->
  <g stroke="#EEF2F6">
    <line x1="104" y1="140" x2="714" y2="140"/>
    <line x1="104" y1="206" x2="714" y2="206"/>
    <line x1="104" y1="272" x2="714" y2="272"/>
    <line x1="104" y1="338" x2="714" y2="338"/>
    <line x1="104" y1="404" x2="714" y2="404"/>
    <line x1="104" y1="470" x2="714" y2="470"/>
    <line x1="104" y1="140" x2="104" y2="512"/>
    <line x1="226" y1="140" x2="226" y2="512"/>
    <line x1="348" y1="140" x2="348" y2="512"/>
    <line x1="470" y1="140" x2="470" y2="512"/>
    <line x1="592" y1="140" x2="592" y2="512"/>
    <line x1="714" y1="140" x2="714" y2="512"/>
  </g>
  <g font-size="12" fill="#94A3B8" text-anchor="end">
    <text x="92" y="145">09:00</text>
    <text x="92" y="211">10:00</text>
    <text x="92" y="277">11:00</text>
    <text x="92" y="343">12:00</text>
    <text x="92" y="409">13:00</text>
    <text x="92" y="475">14:00</text>
  </g>

  <!-- Appointments -->
  <g font-size="12">
    <rect x="110" y="146" width="110" height="54" rx="8" fill="#EAF4FF" stroke="#0072E8" stroke-opacity="0.25"/>
    <rect x="110" y="146" width="4" height="54" rx="2" fill="#0072E8"/>
    <text x="122" y="167" font-weight="600" fill="#06284B">María G.</text>
    <text x="122" y="185" fill="#3A5A7C">Ginecología</text>

    <rect x="232" y="212" width="110" height="54" rx="8" fill="#E6F8F1" stroke="#00B67A" stroke-opacity="0.3"/>
    <rect x="232" y="212" width="4" height="54" rx="2" fill="#00B67A"/>
    <text x="244" y="233" font-weight="600" fill="#06284B">José H.</text>
    <text x="244" y="251" fill="#2F6B55">Pediatría</text>

    <rect x="354" y="146" width="110" height="120" rx="8" fill="#F4EDFD" stroke="#9333EA" stroke-opacity="0.25"/>
    <rect x="354" y="146" width="4" height="120" rx="2" fill="#9333EA"/>
    <text x="366" y="167" font-weight="600" fill="#06284B">Ana M.</text>
    <text x="366" y="185" fill="#6B3FA0">Consulta general</text>

    <rect x="110" y="344" width="110" height="54" rx="8" fill="#E6F8F1" stroke="#00B67A" stroke-opacity="0.3"/>
    <rect x="110" y="344" width="4" height="54" rx="2" fill="#00B67A"/>
    <text x="122" y="365" font-weight="600" fill="#06284B">Luis R.</text>
    <text x="122" y="383" fill="#2F6B55">Estomatología</text>

    <rect x="598" y="278" width="110" height="54" rx="8" fill="#EAF4FF" stroke="#0072E8" stroke-opacity="0.25"/>
    <rect x="598" y="278" width="4" height="54" rx="2" fill="#0072E8"/>
    <text x="610" y="299" font-weight="600" fill="#06284B">Sofía L.</text>
    <text x="610" y="317" fill="#3A5A7C">Pediatría</text>

    <!-- Extra slot -->
    <rect x="232" y="410" width="110" height="54" rx="8" fill="#FFF7E6" stroke="#F59E0B" stroke-opacity="0.4"/>
    <rect x="232" y="410" width="4" height="54" rx="2" fill="#F59E0B"/>
    <text x="244" y="431" font-weight="600" fill="#06284B">Carlos P.</text>
    <text x="244" y="449" fill="#B45309">Cupo extra</text>

    <!-- Empty slot: click to book -->
    <rect x="476" y="410" width="110" height="54" rx="8" fill="none" stroke="#0072E8" stroke-dasharray="5 4"/>
    <text x="531" y="442" font-weight="600" fill="#0072E8" text-anchor="middle">+ Agendar</text>

    <!-- Appointment being dragged -->
    <rect x="476" y="212" width="110" height="54" rx="8" fill="#EAF4FF" stroke="#0072E8" stroke-dasharray="5 4" opacity="0.7"/>
    <rect x="498" y="232" width="110" height="54" rx="8" fill="#fff" stroke="#0072E8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="498" y="232" width="4" height="54" rx="2" fill="#0072E8"/>
    <text x="510" y="253" font-weight="600" fill="#06284B">Elena T.</text>
    <text x="510" y="271" fill="#3A5A7C">Reprogramando…</text>
    <path d="M590 272l0 22 6-6 5 10 4-2-5-10 8 0z" fill="#06284B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
